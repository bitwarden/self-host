name: Build bwsh
run-name: Build bwsh ${{ github.event_name }}

on:
  pull_request:
    paths:
      - "bwsh/**"
      - ".github/workflows/build-bwsh.yml"
      - "version.json"
  push:
    branches:
      - main
    paths:
      - "bwsh/**"
      - ".github/workflows/build-bwsh.yml"
      - "version.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    defaults:
      run:
        shell: bash
        working-directory: bwsh
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format bwsh.slnx --verify-no-changes

      - name: Run tests
        run: dotnet test bwsh.slnx --configuration Release --collect "XPlat Code Coverage"

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            binary: bwsh
          - rid: win-x64
            binary: bwsh.exe
    defaults:
      run:
        working-directory: bwsh
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The version comes from bwsh/Directory.Build.props, not version.json. CI builds are prereleases.
      - name: Publish binary
        env:
          RID: ${{ matrix.rid }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          dotnet publish src/Bwsh/Bwsh.csproj \
            --configuration Release \
            --runtime "$RID" \
            -p:VersionSuffix="alpha.$RUN_NUMBER" \
            --output "publish/$RID"

      - name: Write checksum
        env:
          BINARY: ${{ matrix.binary }}
        working-directory: bwsh/publish/${{ matrix.rid }}
        run: sha256sum "$BINARY" > "$BINARY.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bwsh-${{ matrix.rid }}
          path: bwsh/publish/${{ matrix.rid }}/
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.rid }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            binary: bwsh
          - rid: win-x64
            os: windows-2025
            binary: bwsh.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bwsh-${{ matrix.rid }}

      # Every platform is published from Linux, so this is the first time each binary runs on its own OS.
      - name: Run binary
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          sha256sum --check "$BINARY.sha256"
          chmod +x "$BINARY"
          "./$BINARY" --version
          "./$BINARY" --help
