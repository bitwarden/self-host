---

services:
  bitwarden:
    depends_on:
      - db
    env_file:
      - settings.env
    image: ${REGISTRY:-ghcr.io/bitwarden}/lite:${TAG:-2026.10.0}
    restart: always
    ports:
      - "80:8080"
      - "443:8443"
    tmpfs: /tmp:rw,noexec,nosuid,nodev,size=768m
    environment:
      # Recorded in backup manifests. No default, so it can't drift from the image tag.
      BACKUP_LITE_TAG: ${TAG:-}
    volumes:
      - bitwarden:/etc/bitwarden
      - logs:/var/log/bitwarden
      # Backups: a host path, so they survive `down -v`. See backup/README.md.
      - ${BW_BACKUP_PATH:-./backups}:/backups
      # SQL Server only: where Lite collects SQL Server's backup files.
      # - mssqlbackups:/mssql-backups

    # Rootless, read-only example (recommended for security)
    #
    # Comment out the "volumes" block above, uncomment the block below, and
    # create the bind mounts owned by the same user:
    #   mkdir -p ./config ./logs ./backups && sudo chown 999:999 ./config ./logs ./backups
    #
    # Named volumes are not used here because their contents are owned by root
    # unless you run a rootless docker daemon or podman.
    #
    # user: 999:999
    # read_only: true
    # security_opt:
    #   - no-new-privileges
    # cap_drop:
    #   - ALL
    # volumes:
    #   - ./config:/etc/bitwarden
    #   - ./logs:/var/log/bitwarden
    #   - ./backups:/backups

  # MariaDB Example
  db:
    environment:
      MARIADB_USER: "bitwarden"
      MARIADB_PASSWORD: "super_strong_password"
      MARIADB_DATABASE: "bitwarden_vault"
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    image: mariadb:13
    restart: always
    volumes:
      - data:/var/lib/mysql

  # PostgreSQL Example
  # db:
  #   environment:
  #     POSTGRES_USER: "bitwarden"
  #     POSTGRES_PASSWORD: "super_strong_password"
  #     POSTGRES_DB: "bitwarden_vault"
  #   image: postgres:14
  #   restart: always
  #   volumes:
  #     - data:/var/lib/postgresql/data

  # MS SQL Server Example (amd64 hosts only: SQL Server has no ARM build)
  # The same image as the multi-container product. LOCAL_UID/LOCAL_GID must
  # match Lite's PUID/PGID so both can read the backup files, and BACKUP_DB=0
  # leaves the schedule to Lite. Uncomment mssqlbackups in Lite's volumes and
  # at the bottom too. See backup/README.md.
  # db:
  #   environment:
  #     SA_PASSWORD: "super_strong_password"
  #     ACCEPT_EULA: "Y"
  #     LOCAL_UID: "911"
  #     LOCAL_GID: "911"
  #     BACKUP_DB: "0"
  #   image: ghcr.io/bitwarden/mssql:2026.9.2
  #   restart: always
  #   volumes:
  #     - data:/var/opt/mssql
  #     - mssqlbackups:/etc/bitwarden/mssql/backups

volumes:
  bitwarden:
  logs:
  data:
  # mssqlbackups:
