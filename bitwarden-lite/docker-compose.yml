---

services:
  bitwarden:
    depends_on:
      - db
    env_file:
      - settings.env
    image: ${REGISTRY:-ghcr.io/bitwarden}/lite:${TAG:-2026.9.2}
    restart: always
    ports:
      - "80:8080"
      - "443:8443"
    tmpfs: /tmp:rw,noexec,nosuid,nodev,size=768m
    environment:
      # Recorded in each backup's manifest. Deliberately no default: the app
      # image tag above is rewritten by release automation that lives outside
      # this repo and knows nothing about this line, so a second default would
      # silently drift and make every manifest claim the wrong version. Unset
      # means the manifest records the tag as unknown, not wrongly.
      BACKUP_LITE_TAG: ${TAG:-}
    volumes:
      - bitwarden:/etc/bitwarden
      - logs:/var/log/bitwarden
      # Backups. A host path by default, not a named volume: a backup that
      # `docker compose down -v` destroys along with the vault is not a backup.
      # Point this at somewhere that gets copied off-box. Backup knobs live in
      # settings.env; see backup/README.md.
      - ${BW_BACKUP_PATH:-./backups}:/backups

    # Rootless, read-only example (recommended for security)
    #
    # Comment out the "volumes" block above, uncomment the block below, and
    # create the bind mounts owned by the same user:
    #   mkdir -p ./config ./logs ./backups && sudo chown 999:999 ./config ./logs ./backups
    #
    # Named volumes are not used here because their contents are owned by root
    # unless you run a rootless docker daemon or podman.
    #
    # user: 999:999
    # read_only: true
    # security_opt:
    #   - no-new-privileges
    # cap_drop:
    #   - ALL
    # volumes:
    #   - ./config:/etc/bitwarden
    #   - ./logs:/var/log/bitwarden
    #   - ./backups:/backups

  # MariaDB Example
  db:
    environment:
      MARIADB_USER: "bitwarden"
      MARIADB_PASSWORD: "super_strong_password"
      MARIADB_DATABASE: "bitwarden_vault"
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    image: mariadb:10
    restart: always
    volumes:
      - data:/var/lib/mysql

  # PostgreSQL Example
  # db:
  #   environment:
  #     POSTGRES_USER: "bitwarden"
  #     POSTGRES_PASSWORD: "super_strong_password"
  #     POSTGRES_DB: "bitwarden_vault"
  #   image: postgres:14
  #   restart: always
  #   volumes:
  #     - data:/var/lib/postgresql/data

  # MS SQL Server Example
  # Docs: https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-docker-container-deployment
  # db:
  #   environment:
  #     MSSQL_SA_PASSWORD: "super_strong_password"
  #     ACCEPT_EULA: Y
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   restart: always
  #   volumes:
  #     - data:/var/opt/mssql

volumes:
  bitwarden:
  logs:
  data:
